<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="nav">
    <span class="nav-logo">Portfolio</span>
    <ul class="nav-menu">
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#trabajos">Trabajos</a></li>
      <li><a href="#contacto">Contacto</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <!-- HERO / CARRUSEL -->
  <section id="inicio" class="hero">
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack">
        <!-- Los slides se generan desde script.js -->
      </div>
      <div class="carousel-controls">
        <button id="prevBtn">←</button>
        <div class="carousel-dots" id="carouselDots"></div>
        <button id="nextBtn">→</button>
      </div>
    </div>
  </section>

  <!-- TRABAJOS: generados dinámicamente desde localStorage -->
  <section id="trabajos" class="trabajos">
    <div id="trabajosContainer">
      <!-- Los proyectos se insertan aquí desde script.js -->
    </div>
  </section>

  <!-- CONTACTO -->
  <section id="contacto" class="contacto">
    <h2>¿Trabajamos juntos?</h2>
    <p>Cuéntame tu idea y lo construimos.</p>
    <form class="form" id="contactoForm">
      <input type="text"  name="nombre"  placeholder="Nombre"   required />
      <input type="email" name="email"   placeholder="Email"    required />
      <textarea           name="mensaje" placeholder="Mensaje..." rows="4" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <span>Portfolio 2026</span>
    <div class="footer-links">
      <a href="#">GitHub</a>
      <a href="#">LinkedIn</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
