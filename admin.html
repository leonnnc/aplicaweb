<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Portfolio</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <p class="login-logo">Panel de Control</p>
      <h2>Acceso</h2>
      <form id="loginForm">
        <input type="password" id="loginPass" placeholder="Contraseña" required />
        <button type="submit">Entrar</button>
        <p class="login-error" id="loginError">Contraseña incorrecta</p>
      </form>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel" style="display:none">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">Panel</div>
      <nav class="sidebar-nav">
        <a href="#" class="active" data-view="proyectos">Proyectos</a>
        <a href="#" data-view="nuevo">Agregar</a>
        <a href="index.html" target="_blank">Ver web ↗</a>
      </nav>
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </aside>

    <!-- CONTENIDO -->
    <main class="main">

      <!-- VISTA: LISTA DE PROYECTOS -->
      <div class="view" id="viewProyectos">
        <div class="main-header">
          <h1>Proyectos</h1>
          <button class="btn-add" data-view="nuevo">+ Agregar</button>
        </div>
        <div class="proyectos-lista" id="proyectosLista"></div>
      </div>

      <!-- VISTA: FORMULARIO NUEVO / EDITAR -->
      <div class="view" id="viewNuevo" style="display:none">
        <div class="main-header">
          <h1 id="formTitle">Nuevo Proyecto</h1>
          <button class="btn-back" data-view="proyectos">← Volver</button>
        </div>

        <form class="proyecto-form" id="proyectoForm">
          <input type="hidden" id="proyectoId" />

          <!-- CAMPO NOMBRE + BUSCADOR GITHUB -->
          <div class="form-group">
            <label>Nombre del proyecto</label>
            <div class="nombre-wrap">
              <input type="text" id="pNombre" placeholder="Escribe el nombre o busca en GitHub..." required autocomplete="off" />
              <button type="button" class="btn-gh-search" id="btnGhSearch" title="Buscar en GitHub">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Buscar en GitHub
              </button>
            </div>

            <!-- DROPDOWN de repos GitHub -->
            <div class="gh-dropdown" id="ghDropdown" style="display:none">
              <div class="gh-dropdown-header">
                <span id="ghDropdownStatus">Cargando repos...</span>
                <input type="text" id="ghDropdownSearch" placeholder="Filtrar repositorios..." />
              </div>
              <div class="gh-dropdown-list" id="ghDropdownList"></div>
            </div>
          </div>

          <!-- BADGE de repo vinculado -->
          <div class="gh-linked" id="ghLinked" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            <span id="ghLinkedName">repo vinculado</span>
            <button type="button" id="btnUnlink">✕</button>
          </div>

          <div class="form-group">
            <label>Descripción</label>
            <textarea id="pDesc" rows="3" placeholder="Descripción breve del proyecto..." required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Categoría</label>
              <select id="pCategoria">
                <option value="web">Web</option>
                <option value="diseño">Diseño</option>
                <option value="app">App</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="form-group">
              <label>Estado</label>
              <select id="pEstado">
                <option value="En Progreso">En Progreso</option>
                <option value="Completado">Completado</option>
                <option value="Próximamente">Próximamente</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Tags <span>(separados por coma)</span></label>
            <input type="text" id="pTags" placeholder="Ej: React, Node.js, MongoDB" />
          </div>

          <div class="form-group">
            <label>Color de fondo</label>
            <div class="color-options" id="colorOptions">
              <span class="color-opt active" data-color="linear-gradient(145deg,#1a1a2e,#4a3f6b)" style="background:linear-gradient(145deg,#1a1a2e,#4a3f6b)"></span>
              <span class="color-opt" data-color="linear-gradient(145deg,#1c1c1c,#3a2a2a)" style="background:linear-gradient(145deg,#1c1c1c,#3a2a2a)"></span>
              <span class="color-opt" data-color="linear-gradient(145deg,#0a1628,#1a3a4a)" style="background:linear-gradient(145deg,#0a1628,#1a3a4a)"></span>
              <span class="color-opt" data-color="linear-gradient(145deg,#1a1a0a,#2a3a1a)" style="background:linear-gradient(145deg,#1a1a0a,#2a3a1a)"></span>
              <span class="color-opt" data-color="linear-gradient(145deg,#2a1a1a,#4a2a2a)" style="background:linear-gradient(145deg,#2a1a1a,#4a2a2a)"></span>
              <span class="color-opt" data-color="linear-gradient(145deg,#0a2a1a,#1a4a3a)" style="background:linear-gradient(145deg,#0a2a1a,#1a4a3a)"></span>
            </div>
            <input type="hidden" id="pColor" value="linear-gradient(145deg,#1a1a2e,#4a3f6b)" />
          </div>

          <div class="form-group">
            <label>URL de la web del proyecto <span>(donde se ve el proyecto en vivo)</span></label>
            <input type="url" id="pUrl" placeholder="https://mi-proyecto.com" />
          </div>

          <div class="form-group">
            <label>URL de GitHub <span>(se rellena automático al importar)</span></label>
            <input type="url" id="pGithubUrl" placeholder="https://github.com/usuario/repo" />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save">Guardar proyecto</button>
            <button type="button" class="btn-cancel" data-view="proyectos">Cancelar</button>
          </div>
        </form>

        <!-- Config GitHub (colapsa) -->
        <div class="gh-settings" id="ghSettings">
          <button type="button" class="gh-settings-toggle" id="ghSettingsToggle">
            ⚙ Configuración de GitHub
          </button>
          <div class="gh-settings-body" id="ghSettingsBody" style="display:none">
            <div class="form-group">
              <label>Usuario de GitHub</label>
              <input type="text" id="ghUser" placeholder="Ej: leonnnc" />
            </div>
            <div class="form-group">
              <label>Token personal <span>(para repos privados y mayor rate limit)</span></label>
              <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" />
            </div>
            <button type="button" class="btn-fetch" id="btnSaveGhConfig">Guardar configuración</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
